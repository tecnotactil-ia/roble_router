# Router de casa — instalar como /etc/tmpfiles.d/router.conf (BAJA9).
#
# /var/log/router ya lo crea routerd.service (LogsDirectory=router) y lo
# recrea systemd-tmpfiles en cada arranque si hiciera falta — esta entrada
# es la red de seguridad para cuando algo (una limpieza manual, un /var/log
# en tmpfs que se vacía) se lo lleva por delante ANTES de que routerd llegue
# a arrancar: dns.log (bloqueo) y operaciones.log (oplog) necesitan ese
# directorio para existir desde el primer instante.
d /var/log/router 0755 root root -

# ALTA2 (revisión Opus): /var/lib/router/estadisticas lo crea el propio
# router_estadisticas.py (abrir_db) la primera vez que arranca — pero
# router-estadisticas.service declara `ReadWritePaths=-/var/lib/router/
# estadisticas` (con "-": no falla si no existe), y en una instalación
# LIMPIA ese directorio en efecto no existe todavía antes del primer
# arranque. Sin esta entrada (o sin el "-" en ReadWritePaths) systemd
# fallaría al preparar el espacio de nombres con "226/NAMESPACE" al
# intentar enlazar una ruta que no existe bajo ProtectSystem=strict. Esta
# entrada deja el directorio listo de antemano, con el grupo correcto ya
# puesto (el propio programa, al abrir la base, vuelve a aplicar 0750
# root:routerpanel por si acaso, pero más vale no depender de ese orden).
d /var/lib/router/estadisticas 0750 root routerpanel -
