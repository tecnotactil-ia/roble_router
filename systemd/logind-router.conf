# /etc/systemd/logind.conf.d/90-router.conf
# El portátil es el router de casa: cerrar la tapa, pulsar suspender o
# quedarse inactivo NUNCA debe dormirlo ni apagarlo.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
